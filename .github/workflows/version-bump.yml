name: Auto Increment Version
on:
  push:
    branches:
      - main  # Or your default branch name

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Inject Build Number
        run: |
          # Replaces the placeholder with the unique GitHub Run Number
          sed -i "s/{{BUILD_NUMBER}}/${{ github.run_number }}/g" index.html

      - name: Commit and Push
        run: |
          git config --global user.name "Version Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "Auto-increment build to ${{ github.run_number }} [skip ci]"
          git push
