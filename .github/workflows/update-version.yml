name: Auto Version Update

on:
  push:
    branches:
      - main  # Triggers whenever you save changes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Build Number
        run: |
          # Uses the GitHub Run Number to create a 1.0.X version format
          # This number increases by 1 every time the action runs
          sed -i "s/{{VERSION}}/1.0.${{ github.run_number }}/g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
