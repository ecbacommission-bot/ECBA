name: Auto Version Update

on:
  push:
    branches:
      - main  # Make sure this matches your branch name (main or master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Version SHA
        run: |
          # This command finds {{VERSION}} in index.html and replaces it with the short git commit hash
          sed -i "s/{{VERSION}}/$(git rev-parse --short HEAD)/g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
