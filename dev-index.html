<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECBA Slam Jam | DEV</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        .log-entry { font-family: monospace; border-left-width: 4px; padding-left: 0.75rem; margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-base-300 min-h-screen text-slate-200">

<div id="app" v-cloak class="container mx-auto p-4 max-w-5xl">
    
    <header class="text-center py-6">
        <div v-if="connected" class="badge badge-success badge-outline mb-2 uppercase text-[10px] font-bold tracking-widest">● Database Connected</div>
        <div v-else class="badge badge-error badge-outline mb-2 uppercase text-[10px] font-bold tracking-widest animate-pulse">○ Connecting...</div>
        <h1 class="text-5xl font-black italic tracking-tighter text-warning uppercase drop-shadow-lg">🏀 ECBA Slam Jam</h1>
        <p class="text-xs opacity-50 mt-2">Total Rows Found: {{ rawRowCount }}</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-4 card bg-base-100 shadow-2xl border border-white/5 h-fit">
            <div class="card-body p-6 gap-4">
                <h2 class="text-center font-bold text-xs uppercase opacity-30 tracking-widest mb-2">Submit Entry</h2>
                
                <div class="form-control">
                    <select v-model="form.scorer" class="select select-bordered select-warning w-full text-center font-bold">
                        <option value="">-- Choose Player --</option>
                        <option v-for="p in players" :key="p" :value="p">{{ p }}</option>
                    </select>
                    <input v-model="form.newPlayer" type="text" placeholder="OR Add New Name" class="input input-sm input-bordered mt-2 text-center uppercase text-xs" />
                </div>

                <div class="divider my-0 opacity-10"></div>

                <div class="flex items-center justify-center gap-4 py-2">
                    <button @click="changePoints(-1)" class="btn btn-circle btn-outline btn-sm btn-warning text-xl">−</button>
                    <div class="text-center min-w-[4rem]">
                        <div class="text-4xl font-black" :class="form.points < 0 ? 'text-error' : 'text-warning'">{{ form.points }}</div>
                        <div class="text-[10px] font-bold uppercase opacity-40 leading-none mt-1">{{ form.points < 0 ? 'Punishment' : 'Score' }}</div>
                    </div>
                    <button @click="changePoints(1)" class="btn btn-circle btn-outline btn-sm btn-warning text-xl">+</button>
                </div>

                <div v-if="form.points < 0" class="form-control bg-error/10 p-3 rounded-lg border border-error/30">
                    <label class="label text-[10px] uppercase font-bold text-error py-0 mb-1">Target Victim</label>
                    <select v-model="form.target" class="select select-error select-xs w-full font-bold">
                        <option value="">-- Select Target --</option>
                        <option v-for="p in players" :key="p" :value="p">{{ p }}</option>
                    </select>
                </div>

                <button @click="submitScore" :disabled="submitting" class="btn btn-warning btn-block font-black uppercase tracking-wider">
                    {{ submitting ? 'Saving...' : 'Submit Entry' }}
                </button>
            </div>
        </div>

        <div class="lg:col-span-8 flex flex-col gap-4">
            <div class="tabs tabs-boxed bg-base-100 border border-white/5">
                <button @click="view = 'all'" class="tab tab-sm flex-1 font-bold" :class="{'tab-active !bg-warning !text-black': view === 'all'}">ALL-TIME SCORES</button>
                <button @click="view = 'recent'" class="tab tab-sm flex-1 font-bold" :class="{'tab-active !bg-warning !text-black': view === 'recent'}">RECENT ACTIVITY</button>
            </div>

            <div class="card bg-base-100 shadow-xl border border-white/5 min-h-[400px]">
                <div class="overflow-x-auto p-2">
                    
                    <table v-if="view === 'all'" class="table table-zebra table-sm font-medium">
                        <thead class="text-warning/50 uppercase text-[10px]">
                            <tr><th>Rank</th><th>Player</th><th class="text-right">Total Points</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="(r, idx) in lifetime" :key="r.name">
                                <td class="opacity-20 font-bold italic">{{ idx + 1 }}</td>
                                <td class="font-black text-sm uppercase">{{ r.name }}</td>
                                <td class="text-right font-black text-warning">{{ r.pts }}</td>
                            </tr>
                            <tr v-if="lifetime.length === 0"><td colspan="3" class="text-center py-20 opacity-30 italic text-xs">No data found in database.</td></tr>
                        </tbody>
                    </table>

                    <ul v-if="view === 'recent'" class="p-4 space-y-1">
                        <li v-for="(entry, i) in logs" :key="i" class="log-entry text-xs bg-base-200/30 rounded border-base-content/10 py-1" :style="{ borderLeftColor: entry.color || (entry.isNeg ? '#ff4d4d' : '#333') }">
                            <span class="opacity-30 mr-2 uppercase text-[9px]">[{{ entry.time }}]</span>
                            <span v-html="entry.text"></span>
                        </li>
                    </ul>

                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const { createApp, ref: vRef, onMounted } = Vue;

    createApp({
        setup() {
            const connected = vRef(false);
            const submitting = vRef(false);
            const rawRowCount = vRef(0);
            const view = vRef('all');
            const players = vRef([]);
            const lifetime = vRef([]);
            const logs = vRef([]);
            const form = vRef({ scorer: '', newPlayer: '', target: '', points: 1 });

            const fbApp = initializeApp({
                apiKey: "AIzaSyAIVbirwYrXHTawV71ABWaF2yUZ1FvTb9g",
                authDomain: "ecba-slamjam.firebaseapp.com",
                databaseURL: "https://ecba-slamjam-default-rtdb.firebaseio.com",
                projectId: "ecba-slamjam",
                storageBucket: "ecba-slamjam.firebasestorage.app",
                messagingSenderId: "194161211475",
                appId: "1:194161211475:web:1fbd26416759f10587aea6"
            });
            const fbDb = getDatabase(fbApp);
            const fbRef = ref(fbDb, 'scores');

            onMounted(() => {
                onValue(fbRef, (snap) => {
                    const data = snap.val();
                    if (!data) return;
                    connected.value = true;
                    
                    const pSet = new Set(), lTot = {}, logArr = [];
                    const rows = Object.values(data);
                    rawRowCount.value = rows.length;

                    // Sort chronological
                    rows.sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0));

                    rows.forEach((d) => {
                        const player = d.player;
                        const scorer = d.scorer || d.player;
                        const pts = Number(d.points || 0);
                        const date = new Date(d.timestamp);

                        pSet.add(player); pSet.add(scorer);
                        
                        // Aggregating all data regardless of date
                        lTot[player] = (lTot[player] || 0) + pts;
                        
                        const timeStr = date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                        const logText = pts < 0 
                            ? `<b>${scorer}</b> punished <b>${player}</b>! (${pts})`
                            : `<b>${player}</b> scored ${pts}.`;
                        
                        logArr.unshift({ time: timeStr, text: logText, isNeg: pts < 0 });
                    });

                    players.value = [...pSet].sort();
                    lifetime.value = Object.entries(lTot).map(([name, pts]) => ({ name, pts })).sort((a,b)=>b.pts-a.pts);
                    logs.value = logArr.slice(0, 30);
                });
            });

            const changePoints = (d) => { form.value.points += d; if (form.value.points === 0) form.value.points = d > 0 ? 1 : -1; };
            
            const submitScore = async () => {
                const s = (form.value.scorer || form.value.newPlayer).trim();
                let t = form.value.points < 0 ? form.value.target : s;
                if (!s || (form.value.points < 0 && !t)) return;
                submitting.value = true;
                try {
                    await push(fbRef, { player: t, points: form.value.points, scorer: s, timestamp: serverTimestamp() });
                    form.value = { scorer: '', newPlayer: '', target: '', points: 1 };
                } catch (e) { console.error(e); }
                submitting.value = false;
            };

            return { connected, rawRowCount, view, players, lifetime, logs, form, changePoints, submitScore };
        }
    }).mount('#app');
</script>
</body>
</html>
