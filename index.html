<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8" />
    <title>ECBA Slam Jam</title>
    <style>
      /* --- GLOBAL STYLES --- */
      body { font-family: 'Segoe UI', sans-serif; margin: 2em; background-color: #121212; color: #e0e0e0; text-align: center; }
      
      /* --- HEADERS --- */
      h1, h2 { color: #000; text-shadow: 0 0 5px #ffcc00, 0 0 10px #ffcc00, 0 0 20px #ffcc00; }
      
      /* --- INTERACTIVE BUTTONS --- */
      button { background-color: #ffcc00; color: #000; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; padding: 0.5em 1em; margin: 0.5em; font-size: 1em; transition: 0.2s; text-shadow: 0 0 3px #ffcc00; }
      button:hover { background-color: #ffaa00; text-shadow: 0 0 5px #ffaa00, 0 0 10px #ffaa00; }
      button:disabled { background-color: #555; color: #888; cursor: not-allowed; text-shadow: none; }
      
      /* --- FORM INPUTS (Centered Dropdowns) --- */
      select, input[type="text"] { 
        padding: 0.5em; 
        margin: 0.5em; 
        border-radius: 8px; 
        border: none; 
        font-size: 1em; 
        background-color: #1e1e1e; 
        color: #e0e0e0; 
        box-shadow: 0 0 5px #ffcc00; 
        text-align: center; 
        text-align-last: center; /* Ensures placeholder text is centered */
      }

      /* --- TABLES --- */
      table { margin: 1em auto; border-collapse: collapse; width: auto; max-width: 600px; box-shadow: 0 2px 15px rgba(255,204,0,0.3); }
      th, td { padding: 0.6em 1em; border-bottom: 1px solid #333; text-align: left; }
      th { background-color: #1e1e1e; color: #000; text-shadow: 0 0 5px #ffcc00; }
      tr:nth-child(even) td { background-color: #1a1a1a; }
      
      /* --- ACHIEVEMENTS & TOOLTIPS --- */
      .section { margin-top: 2em; }
      .achievement { color: #ffdd55; font-style: italic; margin-left: 0.3em; cursor: help; font-size: 0.85em; border-bottom: 1px dotted #ffdd55; }
      .touch-tooltip { position: fixed; background: #333; color: #fff; padding: 0.3em 0.5em; border-radius: 5px; z-index: 9999; box-shadow: 0 0 5px #ffcc00; max-width: 200px; }
      .high-score-box { background: #1e1e1e; border: 2px solid #ffcc00; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 1.5em; font-weight: bold; color: #ffcc00; box-shadow: 0 0 10px rgba(255,204,0,0.2); }
      
      /* --- ANIMATIONS (Streaks & Punishments) --- */
      #streakAnimation { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.70); display: none; justify-content: center; align-items: center; z-index: 99999; animation: fadeIn 0.3s ease-out; cursor: pointer; }
      #streakAnimation img { max-width: 90vw; max-height: 90vh; border-radius: 20px; box-shadow: 0 0 40px #ffcc00; }
      .toast { visibility: hidden; background-color: #4CAF50; color: white; text-align: center; border-radius: 10px; padding: 1em; position: fixed; z-index: 1; left: 50%; top: 30px; transform: translateX(-50%); font-weight: bold; }
      
      /* --- FOOTER & BRANDING --- */
      .version-footer { margin-top: 3em; padding-bottom: 2em; font-size: 0.8em; color: #444; cursor: pointer; user-select: none; transition: color 0.2s; }
      .version-footer:hover { color: #ffcc00; }
      #punishSection { display: none; background: rgba(255, 0, 0, 0.1); border: 1px dashed red; padding: 10px; border-radius: 10px; margin-top: 10px; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>

  <body>
    <h1>🏀 ECBA Slam Jam</h1>
    <div id="allTimeHigh"></div>

    <div>
      <label for="player">Player (Scorer):</label>
      <select id="player"></select>
      <input type="text" id="newPlayer" placeholder="Or add new player">
    </div>

    <div style="margin-top: 1.5em;">
      <h2 id="pointsLabel" style="color:#ffcc00;text-shadow:0 0 10px #ffcc00">Points</h2>
      <div style="display:flex;justify-content:center;align-items:center;gap:1em;">
        <button style="font-size:2em;padding:0.4em 0.8em;" onclick="changePoints(-1)">−</button>
        <div id="pointsDisplay" style="font-size:2.5em;min-width:60px;">1</div>
        <button style="font-size:2em;padding:0.4em 0.8em;" onclick="changePoints(1)">+</button>
      </div>

      <div id="punishSection">
        <label style="color:red; font-weight:bold;">Penalty To:</label><br>
        <select id="targetPlayer"></select>
      </div>

      <button id="submitBtn" style="margin-top:1em;font-size:1.4em;padding:0.4em 1.2em;" onclick="submitScore()">Submit Score</button>
    </div>

    <div id="toast" class="toast">✅ Score submitted!</div>
    <div id="leaderboard" class="section"></div>
    <div id="lifetime" class="section"></div>
    <div id="log" class="section"></div>

    <div id="streakAnimation" onclick="this.style.display='none'; document.getElementById('streakGif').src='';">
      <img id="streakGif" src="" />
    </div>

    <div id="footer-image">
      <img src="https://raw.githubusercontent.com/ecbacommission-bot/ECBA/30a13bed097ece6848662daceff7f9572b6fd667/ECBA.png" alt="ECBA Logo" width="300" height="300"/>
    </div>

    <div class="version-footer" onclick="window.location.reload(true);">Build: {{VERSION}}</div>

    <script type="module">
      /* ================================================================================
      LOGIC FLOW OVERVIEW:
      1. INITIALIZE: Connect to Firebase Realtime Database.
      2. LISTEN: 'onValue' triggers whenever the database changes, re-running logic.
      3. PROCESS: 'processLogic' iterates through every score ever recorded to calculate 
         current streaks, monthly totals, and achievements.
      4. RENDER: 'renderUI' updates the tables and dropdowns on the screen.
      5. ACTION: 'submitScore' sends new data to Firebase, resetting the local form.
      ================================================================================
      */

      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      // FIREBASE CONFIGURATION
      const firebaseConfig = {
        apiKey: "AIzaSyAIVbirwYrXHTawV71ABWaF2yUZ1FvTb9g",
        authDomain: "ecba-slamjam.firebaseapp.com",
        databaseURL: "https://ecba-slamjam-default-rtdb.firebaseio.com",
        projectId: "ecba-slamjam",
        storageBucket: "ecba-slamjam.firebasestorage.app",
        messagingSenderId: "194161211475",
        appId: "1:194161211475:web:1fbd26416759f10587aea6"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const scoresRef = ref(db, 'scores');

      // GLOBAL APP STATE
      let pointsValue = 1;
      const CONFIG = { THRESHOLDS: { JUGGERNAUT_STREAK: 10, CENTURION_POINTS: 100, OVERACHIEVER_DAILY: 25, GODSLAYER_KILLS: 3, GODLIKE_STREAK: 6 } };
      
      // VISUAL MAPPING (Icons, Colors, and GIFs for streaks)
      const STREAK_TIERS = {
        2: { icon: '🔥', title: 'is ON FIRE!', color: 'orange', gif: "https://raw.githubusercontent.com/ecbacommission-bot/ECBA/2f0f1ee8e790e3bc63dce62cdd599b83292bb534/Generation_Fiery_Hoop_Effect.gif" },
        3: { icon: '💥', title: 'is LEGENDARY!', color: 'yellow', gif: "https://raw.githubusercontent.com/ecbacommission-bot/ECBA/8d77a1426dfe53237a6d473b0134436747d0c4f8/Generation_Exploding_Hoop_Effect.gif" },
        4: { icon: '👑', title: 'is EPIC!', color: 'green', gif: "https://raw.githubusercontent.com/ecbacommission-bot/ECBA/8d77a1426dfe53237a6d473b0134436747d0c4f8/Generation_King_Hoop_Effect.gif" },
        5: { icon: '⚡', title: 'is UNSTOPPABLE!', color: 'blue', gif: "https://raw.githubusercontent.com/ecbacommission-bot/ECBA/8d77a1426dfe53237a6d473b0134436747d0c4f8/Generation_Lightning_Hoop_Effect.gif" },
        6: { icon: '🌌', title: 'is GODLIKE!', color: 'purple', gif: "https://raw.githubusercontent.com/ecbacommission-bot/ECBA/8d77a1426dfe53237a6d473b0134436747d0c4f8/Generation_Godlike_Hoop_Effect.gif" }
      };
      
      const achievementDescs = { "Juggernaut": "10+ streak", "Godslayer": "Ended 3 Godlike streaks", "Punisher": "Most punishments sent", "The Punished": "Most penalties received", "Centurion": "100+ points this month", "Overachiever": "25+ pts in one day" };
      const negativeGif = "https://raw.githubusercontent.com/ecbacommission-bot/ECBA/09928cdd2e2a676ac0ecd2054e01a941db8e1518/Generation_Punisher_Hoop_Effect.gif";

      /* --------------------------------------------------------------------------------
      UI INTERACTION FUNCTIONS
      --------------------------------------------------------------------------------
      */

      // Updates the Points display and toggles Punish UI if points are negative
      window.changePoints = (delta) => {
        pointsValue += delta;
        if (pointsValue === 0) pointsValue = (delta > 0) ? 1 : -1;
        document.getElementById('pointsDisplay').textContent = pointsValue;
        
        const isPunish = pointsValue < 0;
        document.getElementById('punishSection').style.display = isPunish ? 'block' : 'none';
        document.getElementById('pointsLabel').textContent = isPunish ? 'Punisher Ball' : 'Points';
        document.getElementById('pointsLabel').style.color = isPunish ? 'red' : '#ffcc00';
      };

      // Validates inputs, pushes record to Firebase, and resets the UI
      window.submitScore = async () => {
        const pDropdown = document.getElementById('player');
        const nInput = document.getElementById('newPlayer');
        const tDropdown = document.getElementById('targetPlayer');
        
        const scorer = (pDropdown.value || nInput.value).trim();
        let target = pointsValue < 0 ? tDropdown.value : scorer;
        
        if (!scorer || (pointsValue < 0 && !target)) return alert('Select names first!');
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        showToast();

        try {
          await push(scoresRef, { player: target, points: pointsValue, scorer: scorer, timestamp: serverTimestamp() });
          
          // Form Reset Logic
          nInput.value = '';
          pDropdown.selectedIndex = 0; 
          tDropdown.selectedIndex = 0; 
          window.changePoints(1 - pointsValue); 
        } catch (e) { alert(e.message); }
        finally { btn.disabled = false; }
      };

      /* --------------------------------------------------------------------------------
      DATA PROCESSING LOGIC
      --------------------------------------------------------------------------------
      */

      // Listens for database changes and triggers UI updates
      onValue(scoresRef, (snapshot) => {
        const data = snapshot.val(); if (!data) return;
        
        // Convert Firebase object to sorted array for chronological processing
        const rows = Object.values(data).map(d => [new Date(d.timestamp), d.player, d.points, d.timestamp, d.scorer || d.player]);
        rows.sort((a,b) => a[0]-b[0]);
        
        const processed = processLogic(rows);
        renderUI(processed);
        
        // Live feedback animation for new submissions
        const last = rows[rows.length-1];
        if ((Date.now() - last[3])/1000 < 10) {
           if (last[2] < 0) playAnim(negativeGif);
           else checkForStreakAnimation(processed.log[0]?.text);
        }
      });

      // Core calculation loop for stats, streaks, and achievements
      function processLogic(rows) {
        const now = new Date(), m = now.getMonth(), y = now.getFullYear();
        const players = new Set(), mTotals = {}, lTotals = {}, dTotals = {}, pCounts = {}, victimCounts = {}, maxStreaks = {}, slayers = {}, logEntries = [], historyMap = {};
        let curP = null, curS = 0;

        rows.forEach(([date, player, pts, ts, scorer]) => {
          players.add(player); players.add(scorer);
          const isThisMonth = (date.getMonth() === m && date.getFullYear() === y);
          const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
          
          // Track Month history and Lifetime totals
          if (!historyMap[monthKey]) historyMap[monthKey] = {};
          historyMap[monthKey][player] = (historyMap[monthKey][player] || 0) + pts;
          if (pts > 0) lTotals[player] = (lTotals[player] || 0) + pts;
          
          if (isThisMonth) {
            mTotals[player] = (mTotals[player] || 0) + pts;
            const dayKey = player + date.toDateString();
            dTotals[dayKey] = (dTotals[dayKey] || 0) + pts;
            
            // --- STREAK LOGIC ---
            // If the scorer hasn't changed, increase the streak
            if (curP === scorer) curS++; 
            else {
              // If scorer changed, check if a Godlike streak was ended (Slayer achievement)
              if (curP && curS >= CONFIG.THRESHOLDS.GODLIKE_STREAK) slayers[scorer] = (slayers[scorer] || 0) + 1;
              curP = scorer; curS = 1;
            }
            maxStreaks[scorer] = Math.max(maxStreaks[scorer] || 0, curS);
            
            // --- LOG ENTRY GENERATION ---
            const currentTotal = mTotals[player] || 0;
            if (pts < 0) {
              pCounts[scorer] = (pCounts[scorer] || 0) + 1;
              victimCounts[player] = (victimCounts[player] || 0) + Math.abs(pts);
              logEntries.push(createLogEntry(date, `${scorer} punished ${player}! (${pts}) (Total ${currentTotal})`, true));
            } else {
              if (curS >= 2) {
                const tier = STREAK_TIERS[Math.min(curS, 6)];
                logEntries.push(createLogEntry(date, `${scorer} scored 1 and ${tier.title} (Streak of ${curS}, Total ${currentTotal}) ${tier.icon}`, false, tier.color));
              } else {
                logEntries.push(createLogEntry(date, `${player} scored 1. (Total ${currentTotal})`, false));
              }
            }
          }
        });

        // IDENTIFY SPECIAL ROLES
        const topP = Object.entries(pCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
        const topV = Object.entries(victimCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];

        // CALCULATE ALL-TIME RECORD
        let allTimeHigh = { player: 'N/A', points: 0 };
        Object.keys(historyMap).forEach(mk => Object.entries(historyMap[mk]).forEach(([p, pts]) => {
          if (pts > allTimeHigh.points) allTimeHigh = { player: p, points: pts };
        }));

        return {
          players: [...players].sort(), allTimeHigh,
          monthly: Object.entries(mTotals).map(([p, pts]) => {
            // --- ACHIEVEMENT HIERARCHY ---
            let title = "";
            const dailyMax = Math.max(...Object.keys(dTotals).filter(k=>k.startsWith(p)).map(k=>dTotals[k]), 0);
            if (maxStreaks[p] >= CONFIG.THRESHOLDS.JUGGERNAUT_STREAK) title = "Juggernaut";
            else if (slayers[p] >= CONFIG.THRESHOLDS.GODSLAYER_KILLS) title = "Godslayer";
            else if (p === topP && pCounts[p] > 0) title = "Punisher";
            else if (p === topV && victimCounts[p] > 0) title = "The Punished";
            else if (pts >= CONFIG.THRESHOLDS.CENTURION_POINTS) title = "Centurion";
            else if (dailyMax >= CONFIG.THRESHOLDS.OVERACHIEVER_DAILY) title = "Overachiever";
            
            return { name: p, pts, title, icon: (curP === p && pts > 0) ? (STREAK_TIERS[Math.min(curS, 6)]?.icon || '') : '' };
          }).sort((a,b)=>b.pts-a.pts),
          lifetime: Object.entries(lTotals).map(([p, pts]) => ({player:p, points:pts})).sort((a,b)=>b.points-a.points),
          log: logEntries.reverse().slice(0, 15)
        };
      }

      /* --------------------------------------------------------------------------------
      UI RENDERING FUNCTIONS
      --------------------------------------------------------------------------------
      */

      // Updates the DOM elements with processed data
      function renderUI(data) {
        const pS = document.getElementById('player'), tS = document.getElementById('targetPlayer'), curP = pS.value, curT = tS.value;
        const opts = '<option value="">--Select Player--</option>' + data.players.map(p => `<option value="${p}">${p}</option>`).join('');
        
        pS.innerHTML = opts; tS.innerHTML = opts;
        pS.value = curP; tS.value = curT;
        
        if (data.allTimeHigh.points > 0) document.getElementById('allTimeHigh').innerHTML = `<div class="high-score-box">🌟 All-Time Record: ${data.allTimeHigh.player} (${data.allTimeHigh.points} pts)</div>`;
        document.getElementById('leaderboard').innerHTML = '<h2>📅 Monthly Leaderboard</h2><table>' + data.monthly.map(r => `<tr><td>${r.icon} ${r.name} <span class="achievement" title="${achievementDescs[r.title]||''}">${r.title}</span></td><td>${r.pts}</td></tr>`).join('') + '</table>';
        document.getElementById('lifetime').innerHTML = '<h2>🌟 Lifetime Scores</h2><table>' + data.lifetime.map(r => `<tr><td>${r.player}</td><td>${r.points}</td></tr>`).join('') + '</table>';
        document.getElementById('log').innerHTML = '<h2>📰 Recent Activity</h2><ul style="list-style:none;padding:0">' + data.log.map(l => `<li>${l.text}</li>`).join('') + '</ul>';
        setupTooltips();
      }

      // Creates a formatted HTML string for a single log line
      function createLogEntry(date, msg, isNeg, color) {
        const time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return { text: `<span style="${isNeg ? "color:red; font-weight:bold;" : (color ? `color:${color}; font-weight:bold;` : "")}">[${time}] ${msg}</span>` };
      }

      // Logic to trigger the fullscreen GIF overlay
      function checkForStreakAnimation(logText) {
        if (!logText) return;
        const match = logText.match(/Streak of (\d+)/);
        if (match) {
          const count = Math.min(Number(match[1]), 6);
          if (count >= 2) playAnim(STREAK_TIERS[count].gif);
        }
      }

      // Tooltip logic for achievement clicking
      function setupTooltips() {
        document.querySelectorAll('.achievement').forEach(el => {
          el.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.touch-tooltip').forEach(t => t.remove());
            const tt = document.createElement('div');
            tt.className = 'touch-tooltip';
            tt.textContent = el.getAttribute('title');
            document.body.appendChild(tt);
            const r = el.getBoundingClientRect();
            tt.style.left = r.left + 'px'; tt.style.top = r.bottom + 5 + 'px';
            document.addEventListener('click', () => tt.remove(), { once: true });
          };
        });
      }

      // Helper for showing the streak GIFs
      function playAnim(u) { const d = document.getElementById('streakAnimation'); document.getElementById('streakGif').src=u; d.style.display="flex"; setTimeout(()=> { d.style.display="none"; document.getElementById('streakGif').src=''; }, 5000); }
      
      // Helper for the submission toast
      function showToast() { const t = document.getElementById('toast'); t.style.visibility='visible'; setTimeout(()=>t.style.visibility='hidden', 2000); }
    </script>
  </body>
</html>
