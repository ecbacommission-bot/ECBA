<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8" />
    <title>ECBA Slam Jam</title>
    <style>
      body { font-family: 'Segoe UI', sans-serif; margin: 2em; background-color: #121212; color: #e0e0e0; text-align: center; }
      h1, h2 { color: #000; text-shadow: 0 0 5px #ffcc00, 0 0 10px #ffcc00, 0 0 20px #ffcc00; }
      button { background-color: #ffcc00; color: #000; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; padding: 0.5em 1em; margin: 0.5em; font-size: 1em; transition: 0.2s; text-shadow: 0 0 3px #ffcc00; }
      button:hover { background-color: #ffaa00; text-shadow: 0 0 5px #ffaa00, 0 0 10px #ffaa00; }
      button:disabled { background-color: #555; color: #888; cursor: not-allowed; text-shadow: none; }
      select, input[type="text"] { padding: 0.5em; margin: 0.5em; border-radius: 8px; border: none; font-size: 1em; background-color: #1e1e1e; color: #e0e0e0; box-shadow: 0 0 5px #ffcc00; }
      table { margin: 1em auto; border-collapse: collapse; width: auto; max-width: 600px; box-shadow: 0 2px 15px rgba(255,204,0,0.3); }
      th, td { padding: 0.6em 1em; border-bottom: 1px solid #333; text-align: left; }
      th { background-color: #1e1e1e; color: #000; text-shadow: 0 0 5px #ffcc00; }
      tr:nth-child(even) td { background-color: #1a1a1a; }
      .section { margin-top: 2em; }
      .toast { visibility: hidden; background-color: #4CAF50; color: white; text-align: center; border-radius: 10px; padding: 1em; position: fixed; z-index: 1; left: 50%; top: 30px; transform: translateX(-50%); font-weight: bold; }
      .achievement { color: #ffdd55; font-style: italic; margin-left: 0.3em; cursor: help; font-size: 0.85em; border-bottom: 1px dotted #ffdd55; }
      .high-score-box { background: #1e1e1e; border: 2px solid #ffcc00; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 1.5em; font-weight: bold; color: #ffcc00; box-shadow: 0 0 10px rgba(255,204,0,0.2); }
      #streakAnimation { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.70); display: none; justify-content: center; align-items: center; z-index: 99999; animation: fadeIn 0.3s ease-out; cursor: pointer; }
      #streakAnimation img { max-width: 90vw; max-height: 90vh; border-radius: 20px; box-shadow: 0 0 40px #ffcc00; }
      .version-footer { margin-top: 3em; padding-bottom: 2em; font-size: 0.8em; color: #444; cursor: pointer; user-select: none; transition: color 0.2s; }
      #punishSection { display: none; background: rgba(255, 0, 0, 0.1); border: 1px dashed red; padding: 10px; border-radius: 10px; margin-top: 10px; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>

  <body>
    <h1>🏀 ECBA Slam Jam</h1>
    <div id="allTimeHigh"></div>

    <div>
      <label for="player">Player (Scorer):</label>
      <select id="player"></select>
      <input type="text" id="newPlayer" placeholder="Or add new player">
    </div>

    <div style="margin-top: 1.5em;">
      <h2 id="pointsLabel" style="color:#ffcc00;text-shadow:0 0 10px #ffcc00">Points</h2>
      <div style="display:flex;justify-content:center;align-items:center;gap:1em;">
        <button onclick="changePoints(-1)">−</button>
        <div id="pointsDisplay" style="font-size:2.5em;min-width:60px;">1</div>
        <button onclick="changePoints(1)">+</button>
      </div>
      <div id="punishSection">
        <label style="color:red; font-weight:bold;">Penalty To:</label><br>
        <select id="targetPlayer"></select>
      </div>
      <button id="submitBtn" style="margin-top:1em;" onclick="submitScore()">Submit Score</button>
    </div>

    <div id="toast" class="toast">✅ Score submitted!</div>
    <div id="leaderboard" class="section"></div>
    <div id="lifetime" class="section"></div>
    <div id="log" class="section"></div>

    <div id="streakAnimation" onclick="this.style.display='none';">
      <img id="streakGif" src="" />
    </div>

    <div class="version-footer">Build: {{VERSION}}</div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAIVbirwYrXHTawV71ABWaF2yUZ1FvTb9g",
        authDomain: "ecba-slamjam.firebaseapp.com",
        databaseURL: "https://ecba-slamjam-default-rtdb.firebaseio.com",
        projectId: "ecba-slamjam",
        storageBucket: "ecba-slamjam.firebasestorage.app",
        messagingSenderId: "194161211475",
        appId: "1:194161211475:web:1fbd26416759f10587aea6"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const scoresRef = ref(db, 'scores');

      let pointsValue = 1;
      const CONFIG = { THRESHOLDS: { JUGGERNAUT_STREAK: 10, CENTURION_POINTS: 100, OVERACHIEVER_DAILY: 25, GODSLAYER_KILLS: 3, GODLIKE_STREAK: 6 } };
      const STREAK_TIERS = { 2: { icon: '🔥' }, 3: { icon: '💥' }, 4: { icon: '👑' }, 5: { icon: '⚡' }, 6: { icon: '🌌' } };
      const achievementDescs = { "Juggernaut": "10+ streak", "Godslayer": "Ended 3 Godlike streaks", "Punisher": "Most punishments sent", "The Punished": "Most penalties received", "Centurion": "100+ points this month", "Overachiever": "25+ pts in one day" };

      window.changePoints = (delta) => {
        pointsValue += delta;
        if (pointsValue === 0) pointsValue = (delta > 0) ? 1 : -1;
        document.getElementById('pointsDisplay').textContent = pointsValue;
        document.getElementById('punishSection').style.display = pointsValue < 0 ? 'block' : 'none';
        document.getElementById('pointsLabel').textContent = pointsValue < 0 ? 'Punisher Ball' : 'Points';
        document.getElementById('pointsLabel').style.color = pointsValue < 0 ? 'red' : '#ffcc00';
      };

      window.submitScore = async () => {
        const scorer = (document.getElementById('player').value || document.getElementById('newPlayer').value).trim();
        let target = pointsValue < 0 ? document.getElementById('targetPlayer').value : scorer;
        if (!scorer || (pointsValue < 0 && !target)) return alert('Missing names');
        try {
          await push(scoresRef, { player: target, points: pointsValue, scorer: scorer, timestamp: serverTimestamp() });
          document.getElementById('newPlayer').value = '';
          window.changePoints(1 - pointsValue);
        } catch (e) { alert(e.message); }
      };

      onValue(scoresRef, (snapshot) => {
        const data = snapshot.val(); if (!data) return;
        const rows = Object.values(data).map(d => [new Date(d.timestamp), d.player, d.points, d.timestamp, d.scorer || d.player]);
        rows.sort((a,b) => a[0]-b[0]);
        const processed = processLogic(rows);
        renderUI(processed);
        const last = rows[rows.length-1];
        if ((Date.now() - last[3])/1000 < 10) {
           if (last[2] < 0) playAnim("https://raw.githubusercontent.com/ecbacommission-bot/ECBA/09928cdd2e2a676ac0ecd2054e01a941db8e1518/Generation_Punisher_Hoop_Effect.gif");
        }
      });

      function processLogic(rows) {
        const now = new Date(), m = now.getMonth(), y = now.getFullYear();
        const players = new Set(), mTotals = {}, lTotals = {}, dTotals = {}, pCounts = {}, victimCounts = {}, maxStreaks = {}, slayers = {};
        let curP = null, curS = 0;

        rows.forEach(([date, player, pts, ts, scorer]) => {
          players.add(player); players.add(scorer);
          if (pts > 0) lTotals[player] = (lTotals[player] || 0) + pts;
          if (date.getMonth() === m && date.getFullYear() === y) {
            mTotals[player] = (mTotals[player] || 0) + pts;
            const day = date.toDateString();
            dTotals[player+day] = (dTotals[player+day] || 0) + pts;
            
            if (curP === scorer) curS++; else {
              if (curP && curS >= CONFIG.THRESHOLDS.GODLIKE_STREAK) slayers[scorer] = (slayers[scorer] || 0) + 1;
              curP = scorer; curS = 1;
            }
            maxStreaks[scorer] = Math.max(maxStreaks[scorer] || 0, curS);
            if (pts < 0) {
              pCounts[scorer] = (pCounts[scorer] || 0) + 1;
              victimCounts[player] = (victimCounts[player] || 0) + Math.abs(pts);
            }
          }
        });

        const topP = Object.entries(pCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
        const topV = Object.entries(victimCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];

        return {
          players: [...players].sort(),
          monthly: Object.entries(mTotals).map(([p, pts]) => {
            let title = "";
            if (maxStreaks[p] >= CONFIG.THRESHOLDS.JUGGERNAUT_STREAK) title = "Juggernaut";
            else if (slayers[p] >= CONFIG.THRESHOLDS.GODSLAYER_KILLS) title = "Godslayer";
            else if (p === topP && pCounts[p] > 0) title = "Punisher";
            else if (p === topV && victimCounts[p] > 0) title = "The Punished";
            else if (pts >= CONFIG.THRESHOLDS.CENTURION_POINTS) title = "Centurion";
            return { name: p, pts, title, icon: (curP === p && pts > 0) ? (STREAK_TIERS[Math.min(curS, 6)]?.icon || '') : '' };
          }).sort((a,b)=>b.pts-a.pts),
          lifetime: Object.entries(lTotals).sort((a,b)=>b[1]-a[1]),
          log: rows.reverse().slice(0,10)
        };
      }

      function renderUI(data) {
        const opts = '<option value="">--Select--</option>' + data.players.map(p => `<option value="${p}">${p}</option>`).join('');
        document.getElementById('player').innerHTML = opts; document.getElementById('targetPlayer').innerHTML = opts;
        document.getElementById('leaderboard').innerHTML = '<h2>📅 Monthly</h2><table>' + data.monthly.map(r => `<tr><td>${r.icon} ${r.name} <span class="achievement" title="${achievementDescs[r.title]||''}">${r.title}</span></td><td>${r.pts}</td></tr>`).join('') + '</table>';
        document.getElementById('lifetime').innerHTML = '<h2>🌟 Lifetime</h2><table>' + data.lifetime.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') + '</table>';
      }

      function playAnim(u) { const d = document.getElementById('streakAnimation'); document.getElementById('streakGif').src=u; d.style.display="flex"; setTimeout(()=>d.style.display="none", 5000); }
      function showToast() { const t = document.getElementById('toast'); t.style.visibility='visible'; setTimeout(()=>t.style.visibility='hidden', 2000); }
    </script>
  </body>
</html>
